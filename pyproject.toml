[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  ".git",
  "__pycache__",
  "llm_memory",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"data_import/wikipedia_to_core.py" = ["E402"]
"debug_analyse/run_benchmark.py" = ["E402"]
"debug_analyse/test_questions.py" = ["E402"]
"llm_think/think_controler.py" = ["E402"]

[tool.vulture]
min_confidence = 60
exclude = [
  ".git",
  "__pycache__",
  "llm_memory",
]
paths = [
  "client.py",
  "llm_core",
  "llm_speech",
  "llm_think",
  "data_import",
  "debug_analyse",
]
